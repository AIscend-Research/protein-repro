# Don't forget to surround abstract with double quotes
abstract: "We reproduce the core computational results of ProteinMPNN, a
           message-passing neural network for protein sequence design from
           backbone structure. Using the official code and pretrained weights on
           30 curated PDB structures, we recover the paper's qualitative claims:
           full-backbone design outperforms C-alpha-only design at every sampling
           temperature (46.4% vs. 41.3% recovery at T=0.1), recovery falls and
           perplexity rises monotonically with temperature, and recovery is
           higher at buried than exposed positions. Absolute recovery is below
           the reported 52.4%, which we attribute to dataset mismatch rather than
           implementation divergence. Beyond the original paper, we find that the
           full-backbone and CA-only models cross over under Gaussian coordinate
           noise near 0.45 Å, so the weaker model on clean structures becomes the
           more robust one on badly corrupted input; that no such crossover occurs
           under residue masking; that four of six deliberately constructed
           malformed inputs fail silently; and that Apple Silicon GPU acceleration
           cannot run the model at all. Structure-prediction validation with
           ESMFold shows three of five designs folding to within 1.0 Å of the
           native backbone at only 32-55% sequence identity."

